# Everything this project declares, in one file.
#
# Every setting is explained in docs/, one entry per key. The comments here name
# what a key is; the entry says why, and where the key goes is indexed here:
#
#   https://github.com/yuma-seno/atomaton/blob/main/docs/config/reference.md
#
# Grouped by who consumes the value. Nothing here says where a file lives --
# .github/atomaton/README.md has that, and why.
#
# Everything but `tools` is yours. `tools` is the machinery's own.


# Where work branches from and merges back to. Empty = the default branch.
base_branch: ""


# Run before checks, before deployments, and before an agent starts.
environment:
  setup_commands:
    - "bun install --frozen-lockfile"
  # Rebuilds of the environment one piece of work may ask for. The refusal goes
  # to the agent, which carries on -- unlike the counters under `chain`.
  max_reloads: 3


# How a change is verified. Either let Atomaton run your checks, or name
# `your_workflow` instead. Both is a configuration error.
#
# Every check's commands are read from the DEFAULT BRANCH, so a pull request cannot
# add a check, rename one, or widen what one reaches, and an entry may name its own
# secrets.
checks:
  # Each entry is its own job: it picks its own runner, they run in parallel, and a
  # failure names itself. `commands` run in order, stopping at the first failure.
  #
  # `secrets` is optional, and it decides which tree the commands run in.
  #
  # Naming none runs them in the pull request's tree, with no secret slots in the job
  # at all — where most checks belong, because `bun test` should read the change.
  jobs:
    # One job, because these run in order and each needs what the one before it
    # built: `synth` writes what `test` reads. Splitting them would mean building
    # the tree again in every job to save nothing. Nothing here needs a
    # credential, so no `secrets` are named and they run in the pull request's
    # own tree.
    - name: verify
      commands:
        # The SOURCE, not the deployed copy. This repository builds the deliverable,
        # so `.github/` here is the last release and lags every change by a deploy.
        # A pull request that moves a script would otherwise fail its own check for
        # naming a path that is correct and not yet deployed. An adopter has no such
        # gap -- their tree is one release, whole -- so the shipped default in
        # src/content/config.yaml names the deployed path and this one does not.
        - "bun run src/entrypoints/machinery/scan_secrets.ts"
        - "bun run typecheck"
        - "bun run synth"
        - "bun run test"
    # - name: test-macos
    #   runs_on: macos-latest
    #   commands: ["bun test"]
    # Naming some runs them in the DEFAULT BRANCH's tree and hands the job those
    # secrets and no others, so a relative path below is the file that is already
    # merged. The pull request arrives as a path to read at $ATOMATON_PR_TREE — data,
    # never something to execute. Add the secret to the repository first.
    # - name: cloud-names
    #   secrets: [AWS_ROLE_ARN]
    #   commands:
    #     - ./scripts/check-env-names.sh "$ATOMATON_PR_TREE"

  # your_workflow: ci.yml


# How a merged change ships. One list per event that ships it.
#
# In two halves on purpose. The merge puts the tag on; the TAG publishes. One
# script did both, which meant this repository shipped `on_tag` and never used it
# — and the path that carries a tag into a deployment had no traffic on it to
# show that it was broken. Now every release goes through it.
deploy:
  # Bump the version, merge, and this tags. Idempotent: it runs after every merge
  # and stops at once when the version already has a release.
  on_merge:
    - name: tag-release
      commands:
        - "./.github/atomaton/scripts/tag-release.sh"

  # `branches` is left out, which means the default branch — so a tag publishes
  # only when it points at a commit on main. A tag names a commit, not a branch,
  # and a commit that is not on main is one nobody reviewed.
  on_tag:
    - name: publish
      tags: ["v*"]
      commands:
        - "./.github/atomaton/scripts/publish-release.sh"
  # your_workflow: cd.yml


# When a person, not an agent, performs the merge. Any one of these firing is
# enough.
#
# ## The one merge that is exempt, and why it is not a hole
#
# The update machinery's own pull request changes `.github/**` and merges without
# a person. That is the design, not an oversight: `governed_paths` is a rule about
# AGENT merges -- a rule a merge gate and `merge_pr` enforce, and the update's
# `gh pr merge` consults neither. What stands where a person would are the two
# things this list exists to guarantee, by other means: every path the pull
# request changes is named in its body (the plan's whole output is that list), and
# the release it applies was published by a person pressing the button or asked
# for with `!upgrade`. A conflicted application stops at its pull request, and
# there a person decides. The machinery applying a declared release is the
# person's instruction, carried out.
merge:
  policy: auto              # this repository lets agents merge
  governed_paths:             # changes here are a person's to merge
    - ".github/**"
    # The version declaration. `tag-release.sh` derives the release tag from it,
    # so bumping it and merging IS the release -- and deciding that a set of work
    # is ready to ship is a judgement no agent is positioned to make. Without
    # this, an agent could merge its own release.
    #
    # The whole file, not just `version`: a governed path is a path, and this
    # matcher has no way to name one field of one file. So a dependency bump is
    # governed too, and an agent will not merge one. That is the intended
    # reading rather than a side effect -- a lockfile change is a change to what
    # runs, and it is worth the same look as the version beside it.
    - "package.json"
    # Exclusions, and they must come after what they carve out of: the last pattern
    # claiming a file decides, as in `.gitignore`. These are what an agent
    # writes when asked to write down how this project works, and requiring a
    # person for every sentence of it is what #218 exists to undo. `config.yaml`
    # beside them stays governed -- it decides what a run may reach, the skills do
    # not -- and so does `package.json` above, which decides what ships.
    #
    # The exemption is durable by construction: the update machinery never
    # proposes touching a path the release does not ship, so a skill living
    # directly under `.github/` survives every update untouched. A skill or the
    # prompt template whose durable copy should reach adopters lives in
    # `src/content/` (skills in `src/content/skills/`, the template at
    # `src/content/prompt-template.md`), and a fix that should outlive the next
    # deploy is a normal pull request there.
    - "!.github/atomaton/prompt-template.md"
    - "!.github/atomaton/skills/**"
  gates:
    - reason: "This changes the code that decides what an agent may merge. Read it before merging: a weakening here would not be caught anywhere later."
      when:
        files_changed:
          - "src/domain/delivery/merge-readiness.ts"
          - "src/domain/delivery/merge-gates.ts"
          - "src/domain/delivery/path-patterns.ts"
          - "src/adapters/github/merge-signals.ts"


# What the machinery does when it notices a newer release of the template.
#
#   issue    the notice and nothing else: taking the release is your decision, with
#            `!upgrade` or the Actions button. Also what an unset key means.
#   pr       the release is taken without a notice: the update starts as soon as the
#            release is noticed -- it applies it, opens its pull request, and merges it
#            itself when nothing collided. A collision stops at that pull request for you.
#   pr-agent the same, and an agent is started on the pull request that stopped. It
#            needs `agents.on_update_conflict` to name that agent, which this template
#            ships below.
#
# `pr` and `pr-agent` need the ATOMATON_UPDATE_TOKEN secret, which the update itself
# needs anyway. Without it nothing is started and the machinery writes the notice
# after all, headed by a warning that says why: neither that nor a refused dispatch
# is a reason for the daily run to fail.
#
# `on_new_release` above decides what happens once a release is noticed; this decides
# which ones are, and both keys sit under `update`.
#
# The template ships `marked`, stated outright rather than left to the machinery's
# own reading of an absent key. The mark is what the setting is for, and the
# absent-key reading is older than the key is: a repository set up before this line
# reached the template notices every release while its config lacks the key. When an
# update merge brings the line in, the scope becomes `marked` and the repository
# starts noticing only the releases whose notes carry `atomaton:adopt` -- to keep
# noticing every release, set this to `all`.
update:
  on_new_release: pr-agent
  detection_scope: all


# When a chain of runs stops and asks a person.
chain:
  after_handoffs: 5                 # handoffs with nobody else commenting
  after_runs_without_change: 2      # runs that pushed, opened and merged nothing
  # State one run leaves for the next. Change only on a name collision.
  labels:
    in_progress: atomaton/in-progress
    sub_issue: atomaton/sub-issue
    launched: atomaton/launched
    waiting_for_person: atomaton/waiting-for-person


# The agents a workflow starts when no issue or pull request can name one.
#
# Almost every run is started by something that already knows who it wants: a
# person types `/<agent>`, an agent writes a handoff, a pull request carries the
# agent that opened it, a parent issue carries the agent that was working on it.
# Those are read from the thread at run time, and naming one here would be a
# second answer to a question the thread already answers.
#
# What is left is the runs with no thread to read -- a workflow reacting to a
# condition rather than to a request. A key a workflow always starts from is
# REQUIRED: a default would be this file naming an agent, and a project that
# renamed its engineer would get a run for an agent that does not exist. A
# missing key fails the pull request's own check.
agents:
  # Started on the issue opened for an `ATOMA_CONFIG_FINDING` line -- atoma's
  # report that the tools file it was handed has a defect it carried on past.
  on_config_finding: engineer

  # Started on a root issue an agent files while it works. `create_root_issue` is where
  # a defect in the machinery and a decision a person has to make both go, and the
  # issue it makes is created with the run's own token -- so no event starts anything
  # on it, and the tool dispatches this run itself.
  #
  # `off` files the issue and starts nobody. It is the one key in this section with an
  # off switch, because a report nobody asked to be acted on is a project's call
  # whether to act on; the rest name a run that always happens.
  on_agent_issue: atomaton

  # Started on an update pull request that stopped on a conflict. Required only
  # when `update.on_new_release` is `pr-agent` -- this repository runs
  # `pr-agent`, so it is named here, and because every no-thread agent name the
  # template ships, this adoption ships too.
  on_update_conflict: engineer


# What an agent can reach, and under what watch.
#
# The machinery's own configuration. This project owns the runtime it uses, so it
# is declared here rather than in a second file; the generator writes the part the
# core reads. Most projects never edit past this line.
tools:
  # Repository secrets the servers may reach. Separate from the ones a check or a
  # deployment names on its own entry: only these enter an agent's own environment.
  secrets: []

  # Your own tool servers, and overrides of the ones Atomaton ships.
  #
  # A name Atomaton does not ship is added. A name it does ship is overridden field by
  # field, so raising one timeout does not mean copying an argv. The shipped set is
  # listed in .github/atomaton/README.md and in docs/tools/reference.md; it is not here
  # because deleting one breaks a run, and an agent only starts the servers its own
  # `mcp_servers` names.
  servers: {}

  # Your own hooks, run after Atomaton's on every call to every server.
  # Added to what Atomaton watches, never replacing it.
  watch: {}
