            if [ -n "$secret_value" ]; then
              export "${secret_name}=${secret_value}"
              echo "Secret ${secret_name} is available to this run."
            else
              echo "::warning::config.yaml declares secret ${secret_name}, but this repository has no secret by that name. Whatever needs it will fail."
            fi
            slot=$((slot + 1))
          done

          echo "$ATOMATON_COMMANDS" | jq -r ".[]" | while IFS= read -r command; do
            echo "::group::$command"
            if ! bash -c "$command"; then
              echo "::endgroup::"
              echo "::error::${{ matrix.name }}: $command"
              exit 1
            fi
            echo "::endgroup::"
          done
  atomaton-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request, as the tree under test
