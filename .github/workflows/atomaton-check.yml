        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/run_environment_setup.ts"
      - name: Install Atoma CLI
        shell: bash
        run: |
          VERSION="v0.7.0"
          if [ "$VERSION" = "source" ]; then
            echo "Building Atoma from source (atoma-src/) ..."
            cargo install --path atoma-src --force --locked
          elif [ "$VERSION" = "latest" ]; then
            URL="https://github.com/yuma-seno/atoma/releases/latest/download/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          else
            URL="https://github.com/yuma-seno/atoma/releases/download/${VERSION}/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          fi
          atoma --version
      - name: Check the tool servers against their guards
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/check_live_tools.ts"
      - name: Run the end-to-end suite against the real CLI
        shell: bash
        env:
          ATOMA_BIN: /usr/local/bin/atoma
        run: |
          if [ -f package.json ] && grep -q '"test:e2e"' package.json; then
            bun run test:e2e
          else
            echo "this repository does not carry the template's e2e suite (no test:e2e script in package.json); Atomaton's own suite is verified upstream, not here"
          fi
  atomaton-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
