    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      uncredentialled: ${{ steps.split.outputs.uncredentialled }}
      credentialled: ${{ steps.split.outputs.credentialled }}
