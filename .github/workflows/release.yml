# Release — one button: declare a version in `package.json`, merge the pull
# request that declares it, wait for the tag to publish, and take the release
# onto this repository's own `.github/` through the update machinery.
#
# ## Why this file is hand-written, and why nothing mirrors it
#
# It is not in the deliverable, so no adopter receives a workflow naming a secret
# they do not have; no agent triggers it and no agent step reads a credential; and
# it does one thing a person asks for, by pressing a button. `.github/**` is in
# `merge.governed_paths`, so the pull request that edits this file is one an agent
# cannot merge: the file is a person's, and stays one.
#
# It used to live in `self/`, mirrored into `.github/` by the self-deploy, because
# the self-deploy rebuilt `.github/` from scratch and would have eaten anything
# hand-written left there. The rebuild is gone -- the update machinery merges
# three-way against the manifest, and a path it does not ship is a path it never
# touches -- so hand-written files now live here directly, and `self/` is gone
# with the rebuild that needed it.
#
# ## What a release is here
#
# `package.json`'s `version` is the single declaration. `tag-release.sh` derives the
# tag from it, so declaring a version and merging IS the release:
#
#     package.json version -> deploy.on_merge -> tag-release.sh   -> vX.Y.Z
#                          -> deploy.on_tag   -> publish-release.sh -> release
#
# Nothing else declares a version, so nothing else has to be kept in step. This
# workflow exists to make the one edit that starts that chain, and to refuse the one
# edit that should never start it.
#
# ## What it refuses, and what it does not
#
# A downgrade. That is the only thing checked, because it is the only thing that is
# not a judgement: a version is a claim about what is being shipped, and this
# workflow is not positioned to make it. It checks that the number goes up, not
# down, and leaves the rest to the person merging.
#
# It also refuses a version that is already released, because there is nothing to
# do: the tag exists, the release exists, and re-declaring it changes nothing.
#
# ## What an empty input means
#
# An empty `version` is the default, and it means "the next one": the last segment of
# the declared version is incremented, with no carry (`0.2.9` -> `0.2.10`, and in a
# prerelease `0.3.0-rc.1` -> `0.3.0-rc.2`). It is a convenience for the common case,
# not a judgement: a person who wants any other number types it, and the same checks
# run on whatever results. There is nothing to bump when `package.json` declares no
# version at all, so the first release names one.
#
# ## Why there is no PAT, and no auto-merge setting
#
# Every write here runs on `GITHUB_TOKEN`, and three events never fire because of
# it -- GitHub starts no workflow run for an event its own token triggered. Each
# one is bridged explicitly, which is the same pattern the machinery uses for an
# agent's own merges:
#
# - the release pull request fires no `pull_request` event, so its required check
#   would never start: `dispatch_pr_validation.ts` starts it, through the same
#   bridge (`dispatchPrValidation`) an agent's pull request is validated with.
#   Not `dispatchCi`: a check derived from a `workflow_dispatch` run does not
#   count toward a required status check -- only the mirror
#   `validate_pull_request.ts` writes through the Checks API does -- so the CI
#   jobs ran and the merge job waited for a context nothing would register;
# - the merge fires no `push`, so `deploy.on_merge` would never run:
#   `dispatch_cd.ts` starts the deploy, through `dispatchCd`;
# - the tag `tag-release.sh` creates fires no `push` either, so the publish would
#   never run: the deploy workflow's own `dispatch-new-tags` job bridges that one,
#   and nothing here needs to.
#
# No PAT is named and no secret is read; `ATOMATON_UPDATE_TOKEN` is the update
# workflow's own secret, used there, not here. And no "Allow auto-merge" setting
# is needed, because nothing waits on GitHub to merge: the check is started here,
# so its appearance is this workflow's own doing, and the merge waits for it
# directly. The wait that matters is for the REQUIRED check to exist at all -- on
# a pull request opened moments ago, `atomaton-check` has not registered yet (the
# validator writes it once CI has concluded, which is minutes), and a merge fired
# while the visible checks are green races that wait and loses. The measured
# failure was a merge the base branch policy refused while every check on screen
# was green.
#
# ## The application is the machinery, not a rebuild
#
# `deploy: true` (the default) runs the update machinery's own script, from THIS
# checkout, on this repository: `src/entrypoints/machinery/update_atomaton.ts`,
# the same script an adopter's `!upgrade` runs. Not a dispatch to the deployed
# update workflow, deliberately: the workflow that exists on the default branch
# at this moment is the release BEFORE this one, and its script cannot complete
# a clean application (it opens the pull request with a token that fires no
# event and merges by asking for auto-merge). Running the code this PR delivers
# is what makes a release apply itself on the very first try -- the machinery
# cannot bootstrap itself through the machinery that predates it. This is also
# why the one secret appears here: the update pushes, opens its pull request,
# and merges as `ATOMATON_UPDATE_TOKEN`, the identity that starts the checks and
# carries the push. When the plan is clean the machinery merges itself; when it
# is not, the update stops at its pull request for a person.
#
# This replaces the self-deploy, which rebuilt `.github/` from the release and so
# needed a mirror of every hand-written file in `self/`; three-way merging needs
# no mirror, and the rebuild's silent deletions went with it.
#
# ## What this needs, once, in the repository's Settings
#
# `ATOMATON_UPDATE_TOKEN` as a secret -- the same one an adopter sets. Nothing else.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (a leading "v" is accepted). Names the version directly; leave empty to derive it from the bump.'
        required: false
        default: ''
        type: string
      bump:
        description: 'Which part of the declared version to bump. Required unless "version" names one.'
        required: false
        default: '(choose)'
        type: choice
        options:
          - '(choose)'
          - patch
          - minor
          - major
      deploy:
        description: 'After publishing, take the release onto this repository''s .github/ through the update machinery.'
        required: false
        default: true
        type: boolean
      adopt:
        description: 'Mark this release for prompt adoption: the `atomaton:adopt` marker is appended to its notes as an HTML comment, so repositories that notice marked releases only pick it up. The notes themselves stay plain prose.'
        required: false
        default: false
        type: boolean

# Read-only at the workflow level; each job grants exactly what its steps need.
permissions:
  contents: read

# One release at a time, and the second waits rather than cancelling the first: a
# release is a version of the whole of main, and two interleaved declarations would
# race for which version the next one is derived from. An update running at the
# same time as the application below is not a default the machinery breaks under:
# both name the same update branch -- keyed to the target tag, so one pull request
# -- and a push that loses the race rechecks a tree that already holds the plan.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  refuse-bot:
    name: Refuse a non-human trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The agent runner's token carries `actions: write`, so dispatching this
      # file is within what that token could theoretically do. An agent has no
      # route to it today, but "no route today" is a denylist, and this is a
      # token that can open a pull request against a governed path. So the check
      # is a property of the job rather than of what an agent happens to be
      # offered.
      - name: Refuse a non-human trigger
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          case "$ACTOR" in
            *'[bot]'|github-actions)
              echo "::error::$ACTOR is not a person. This workflow is dispatched by hand, on purpose."
              exit 1
              ;;
          esac
          echo "dispatched by $ACTOR"

  release:
    name: Prepare the release pull request, and start its check
    needs: refuse-bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The branch push, the pull request, and the check dispatch: three writes the
    # job makes itself, all on the workflow's own token.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.write.outputs.changed }}
      pr: ${{ steps.open.outputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # The declared version, read before anything else: it is what the bump
          # derives the new version from, and what the downgrade check compares against.
          CURRENT=$(jq -r '.version // empty' package.json)
          if [ -z "$CURRENT" ]; then
            echo "::error::package.json declares no version; there is nothing to compare against, and nothing to bump. Name the version explicitly."
            exit 1
          fi

          # A leading `v` is how a tag is written and how a person says it out
          # loud; the declaration is bare. Accept both, store one.
          #
          # With no version named, the bump is required -- the input is a choice
          # whose first option is a sentinel, so a person pressing the button picks
          # which segment moves; the number has no meaning of its own, but which
          # part changes is still the person's to say. '(choose)' reaching here
          # means it was not picked, and a run that guessed would release under a
          # number nobody chose. The last segment is required to be a number so
          # that `0.3.0-rc` (a valid prerelease with no number to bump) fails
          # loudly rather than deriving nonsense -- a person names that one.
          if [ -n "$REQUESTED" ]; then
            NEW="${REQUESTED#v}"
          else
            case "$BUMP" in
              patch)
                LAST="${CURRENT##*.}"
                if ! [[ "$LAST" =~ ^[0-9]+$ ]]; then
                  echo "::error::cannot bump the last segment of '${CURRENT}': it is not a number. Name the version explicitly."
                  exit 1
                fi
                NEW="${CURRENT%.*}.$(( LAST + 1 ))"
                ;;
              minor)
                MIDDLE="${CURRENT#*.}"; MIDDLE="${MIDDLE%%.*}"
                if ! [[ "$MIDDLE" =~ ^[0-9]+$ ]]; then
                  echo "::error::cannot bump the middle segment of '${CURRENT}': it is not a number. Name the version explicitly."
                  exit 1
                fi
                NEW="${CURRENT%%.*}.$(( MIDDLE + 1 )).0"
                ;;
              major)
                FIRST="${CURRENT%%.*}"
                if ! [[ "$FIRST" =~ ^[0-9]+$ ]]; then
                  echo "::error::cannot bump the first segment of '${CURRENT}': it is not a number. Name the version explicitly."
                  exit 1
                fi
                NEW="$(( FIRST + 1 )).0.0"
                ;;
              *)
                echo "::error::no version was named and no bump was chosen. Pick 'patch', 'minor' or 'major' in the form, or type the version. Nothing has been derived."
                exit 1
                ;;
            esac
            echo "::notice::bumping ${BUMP}: ${CURRENT} -> ${NEW}"
          fi

          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${NEW}' is not a plain semver version. Expected X.Y.Z, optionally with a -prerelease suffix."
            exit 1
          fi

          # The one thing that is not a judgement: does the number go up? Equal
          # is allowed -- re-declaring the same version is how a release whose
          # publish failed is retried.
          #
          # Not `sort -V` on the whole string. GNU version sort orders a
          # prerelease ABOVE its release, so it would call 1.0.0-rc.1 -> 1.0.0 a
          # downgrade. The core is compared with it; the prerelease is not.
          is_downgrade() {
            local cur="$1" new="$2"
            local cur_core="${cur%%-*}" new_core="${new%%-*}"
            local lower_core
            lower_core=$(printf '%s\n%s\n' "$cur_core" "$new_core" | sort -V | head -n1)
            if [ "$lower_core" != "$cur_core" ]; then
              return 0
            fi
            if [ "$cur_core" != "$new_core" ]; then
              return 1
            fi

            # Equal cores. A prerelease is below its release, so a final version
            # is never below its own prerelease, and the reverse is a downgrade.
            local cur_pre="" new_pre=""
            if [ "$cur" != "$cur_core" ]; then cur_pre="${cur#*-}"; fi
            if [ "$new" != "$new_core" ]; then new_pre="${new#*-}"; fi
            if [ -z "$cur_pre" ] && [ -n "$new_pre" ]; then return 0; fi
            if [ -n "$cur_pre" ] && [ -z "$new_pre" ]; then return 1; fi
            if [ -z "$cur_pre" ] && [ -z "$new_pre" ]; then return 1; fi

            local lower_pre
            lower_pre=$(printf '%s\n%s\n' "$cur_pre" "$new_pre" | sort -V | head -n1)
            if [ "$lower_pre" != "$cur_pre" ]; then
              return 0
            fi
            return 1
          }

          if is_downgrade "$CURRENT" "$NEW"; then
            echo "::error::${NEW} is below the declared ${CURRENT}. A release does not go backwards; if this is a correction, ship it as a new version."
            exit 1
          fi

          # Already out. The tag exists and the release exists, so declaring it
          # again would change nothing and open a pull request for no diff.
          if gh release view "v${NEW}" >/dev/null 2>&1; then
            echo "::error::v${NEW} is already released. There is nothing to do."
            exit 1
          fi

          # The tag exists but the release does not: a publish that did not
          # finish. `tag-release.sh` will not create the tag twice, so declaring
          # the version again would open a pull request that merges to nothing --
          # the tag is already there and the publish is what is missing. The fix
          # is to re-run the publish, which is idempotent.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${NEW}" >/dev/null 2>&1; then
            echo "::error::v${NEW} is tagged but not released, so its publish did not finish. Re-run it: gh workflow run atomaton-deploy.yml --ref v${NEW} -f target=publish"
            exit 1
          fi

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "declaring ${CURRENT} -> ${NEW}"

      - name: Write the version
        id: write
        env:
          NEW: ${{ steps.version.outputs.new }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail

          # Same version, no release. That is a publish that did not finish, not a
          # change to make: the declaration is already right, so the fix is to
          # re-run the deploy rather than open a pull request for no diff.
          if [ "$NEW" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json already declares ${NEW}. If its release is missing, re-run the deploy: gh workflow run atomaton-deploy.yml --ref v${NEW} -f target=publish"
            exit 0
          fi

          # `jq` rather than a regex over the line: it sets the field and leaves
          # the rest of the file alone, so the diff is the one line that changed.
          # The file is already 2-space indented, which is what jq writes.
          jq --indent 2 --arg v "$NEW" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json already declares ${NEW}; nothing to open a pull request for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- package.json
          fi

      - name: Open the pull request, and start its check
        id: open
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.version.outputs.new }}
          CURRENT: ${{ steps.version.outputs.current }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW}"

          git config user.name "atomaton-release"
          git config user.email "atomaton-release@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add package.json

          # Through a file, not `-m`: a multi-line message written inline has to
          # start its continuation lines at column 0 to keep them out of the
          # commit body's indentation -- and column 0 leaves this block scalar,
          # which makes the whole workflow unparseable. GitHub's response to an
          # unparseable workflow is not an error; it registers no triggers and
          # says nothing.
          MSG=$(mktemp)
          {
            echo "release: declare ${NEW}"
            echo
            echo "Prepared by .github/workflows/release.yml, dispatched by ${ACTOR}."
            echo
            echo "package.json version ${CURRENT} -> ${NEW}. Merging this tags v${NEW}"
            echo "and publishes it; nothing else declares a version."
          } > "$MSG"
          git commit -q -F "$MSG"
          rm -f "$MSG"

          # Force, because the branch is derived from the input: re-running for the
          # same version should reproduce it rather than conflict with the previous
          # attempt. Nothing hand-written belongs here.
          #
          # The push is made with GITHUB_TOKEN, so it fires no event -- that is
          # why the check is dispatched below rather than waited for.
          git push -q --force origin "$BRANCH"

          {
            echo "Declares version \`${NEW}\` in \`package.json\` (was \`${CURRENT}\`)."
            echo
            echo "Prepared by \`.github/workflows/release.yml\`, dispatched by @${ACTOR}. No agent was involved."
            echo
            echo "Merging this **is** the release: \`deploy.on_merge\` runs \`tag-release.sh\`, which derives \`v${NEW}\` from this declaration, and the tag's own deployment publishes it."
            echo
            echo "This workflow merges the pull request itself once the required check has run and passed, waits for the publish, and -- with \`deploy: true\`, the default -- dispatches the update machinery to take v${NEW} onto this repository's own \`.github/\`."
          } > /tmp/body.md

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/body.md
            echo "::notice::updated pull request #${EXISTING}"
          else
            gh pr create \
              --title "release: declare ${NEW}" \
              --body-file /tmp/body.md \
              --head "$BRANCH"
          fi

          # Read back rather than parsed out of `gh pr create`: the URL is what it
          # prints, and an edit prints nothing at all. The list is the one answer
          # true for both paths.
          PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::error::the release pull request for ${BRANCH} could not be found after it was created."
            exit 1
          fi
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"

          # A pull request opened with GITHUB_TOKEN fires no event, so nothing
          # starts the check the ruleset requires. Through the bridge, like every
          # other dispatch -- but the VALIDATOR's bridge, not the CI one: the CI
          # workflow runs jobs and registers no context the ruleset accepts, while
          # atomaton-validate-pr.yml holds `checks: write` and writes the required
          # check run itself. This is the same script an agent's pull request is
          # validated through.
          #
          # No `--ask`: the release body names no `/<agent>`, so validation
          # dispatches nobody and claims no comment. An empty ask is the shape for
          # that; only the agent dispatch, which this PR skips, requires one.
          # `asked-by-person true` for the one CI-waiting comment: a person pressed
          # the button, and the wait is minutes long. The value is required --
          # `parseArgs` takes this option as a string and a bare `--asked-by-person`
          # aborts the step before anything is dispatched.
          bun src/entrypoints/machinery/dispatch_pr_validation.ts \
            --repo "$GITHUB_REPOSITORY" --number "$PR" --branch "$BRANCH" --asked-by-person true

  merge-release:
    name: Merge the release pull request, and wait for the release
    needs: release
    runs-on: ubuntu-latest
    # The merge's own Deploy job (sixty minutes), the tag's publish it waits for
    # (seventy-five), and the queue before each. A budget shorter than that path
    # reports a timeout as a failed release.
    timeout-minutes: 180
    # `contents: write` is the merge itself: GitHub's merge endpoint is a write to
    # the base branch, and a job holding only reads gets all the way to a red step
    # after the release pull request has passed its checks. The merge is made with
    # the workflow's own token, so it fires no `push` -- the deploy is dispatched
    # through the bridge below, which is why `actions: write` is here too.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Merge the release pull request, and wait for the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.release.outputs.pr }}
          CHANGED: ${{ needs.release.outputs.changed }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Same version, no pull request. If the release is missing, the publish
          # is what did not finish, and it is re-run rather than re-declared.
          if [ "$CHANGED" != "true" ]; then
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "$TAG is already published; nothing to merge."
              exit 0
            fi
            echo "::error::package.json already declares $TAG but no release exists. Re-run the publish: gh workflow run atomaton-deploy.yml --ref $TAG -f target=publish"
            exit 1
          fi

          if [ -z "$PR" ]; then
            echo "::error::Release reported a changed version but no pull request number."
            exit 1
          fi

          # Wait for the REQUIRED check to EXIST, not for the visible checks to
          # finish. It is written by the validator once CI has concluded, so on a
          # pull request opened moments ago `atomaton-check` is not in the rollup
          # yet, and every check that IS visible can be green while the deciding
          # one does not exist. The measured failure was a merge the base branch
          # policy refused in exactly that state. The previous job hands the pull
          # request to the validator, so the check's arrival is minutes, not a
          # maybe.
          SEEN=""
          for _ in $(seq 1 90); do
            SEEN=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.name == "atomaton-check")] | length')
            if [ "$SEEN" != "0" ] && [ -n "$SEEN" ]; then break; fi
            sleep 10
          done
          if [ "$SEEN" = "0" ] || [ -z "$SEEN" ]; then
            echo "::error::the required check never registered on #$PR in fifteen minutes. Read the check workflow's run; once it has run, merge by hand and re-run this job."
            exit 1
          fi

          # Now that the deciding check exists, watch everything on the pull
          # request. A red change is not merged: this fails and leaves the pull
          # request open.
          gh pr checks "$PR" --repo "$REPO" --watch --fail-fast --interval 10

          # The merge is made with GITHUB_TOKEN, so it fires no `push`, and
          # `deploy.on_merge` never runs on its own -- the dispatch below is the
          # bridge for that, the same one the machinery's own merges go through.
          gh pr merge "$PR" --repo "$REPO" --merge

          # The merge commit is the fact the next stage needs; poll rather than
          # assume the command's exit means the merge happened.
          SHA=""
          for _ in $(seq 1 60); do
            SHA=$(gh pr view "$PR" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // empty')
            if [ -n "$SHA" ]; then break; fi
            sleep 10
          done
          if [ -z "$SHA" ]; then
            echo "::error::#${PR} merged but GitHub reported no merge commit, so the Deploy run cannot be found."
            exit 1
          fi

          # Through the bridge. The deploy runs against main's tip, which is what
          # a push would have delivered; between this merge and the dispatch,
          # only another serialized release could move main, and the concurrency
          # group rules that out.
          bun src/entrypoints/machinery/dispatch_cd.ts --repo "$REPO" --ref main

          # The dispatched run is the one to watch. It may not exist for a few
          # seconds, and reading it is a plain list so a transient failure is a
          # retry rather than the answer.
          #
          # `--event workflow_dispatch`, and the FIRST match is the right one: the
          # tag's own run names the same commit and is also a dispatch, but it
          # only exists after `tag-release.sh` has run inside this one, minutes
          # from now. Watching the first run found is watching the run whose
          # success says the tag was created at all.
          RUN=""
          for _ in $(seq 1 60); do
            RUN=$(gh run list --repo "$REPO" --workflow atomaton-deploy.yml --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$RUN" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN" ]; then
            echo "::error::No Deploy run appeared for ${SHA}. See https://github.com/${REPO}/actions"
            exit 1
          fi

          echo "Waiting for Deploy run ${RUN} for ${SHA}."
          if ! gh run watch "$RUN" --repo "$REPO" --exit-status --interval 10; then
            echo "::error::The Deploy run for ${SHA} failed: https://github.com/${REPO}/actions/runs/${RUN}"
            exit 1
          fi

          # The deploy run waits for the tag's publish run, so its success should
          # already mean the release exists. It is checked anyway: it is the fact
          # the next stage needs, and a release that is tagged but not published
          # is exactly the state this workflow exists to keep out of the next
          # step.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Published $TAG."
              break
            fi
            sleep 10
          done
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG was not published after Deploy succeeded. See https://github.com/${REPO}/actions"
            exit 1
          fi

      # The marker is a flag on this dispatch, never a line a person writes
      # into the notes by hand: a hand-written marker is a forgotten marker.
      # It goes in as an HTML comment, so the rendered notes stay the plain
      # prose they are written as, while the notice machinery -- which reads
      # the raw body -- still finds it. Already marked means already done:
      # a re-run of this workflow appends nothing twice.
      - name: Mark the release for prompt adoption
        if: inputs.adopt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          if printf '%s' "$BODY" | grep -q 'atomaton:adopt'; then
            echo "$TAG already carries the adopt marker; nothing to do."
            exit 0
          fi
          printf '%s\n\n<!-- atomaton:adopt -->\n' "$BODY" > "$RUNNER_TEMP/adopt-notes.md"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/adopt-notes.md"
          echo "Marked $TAG for prompt adoption."

  apply-to-self:
    name: Apply the release through the update machinery
    needs: [release, merge-release]
    # `release` is needed alongside `merge-release` because the tag is its output:
    # GitHub exposes a job's outputs only to jobs that name it in `needs`, and a
    # run that forgot this once built a branch name from an empty tag.
    if: inputs.deploy && needs.merge-release.result == 'success'
    runs-on: ubuntu-latest
    # The application inside waits for the repository's own checks before it
    # merges (the same wait `atomaton-update.yml`'s job carries): the check's
    # path on this repository is minutes on its own, and a job killed mid-wait
    # would leave an applied-but-unmerged update pull request standing. It joins
    # the update's own concurrency group rather than standing outside it: a
    # `!upgrade` during this window would otherwise run the same plan against the
    # same branch from a second checkout, and while nothing corrupts -- one merge
    # wins -- serialising them here is free.
    timeout-minutes: 60
    concurrency:
      group: atomaton-update
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The update script reads the rollup and watches the checks its merge waits
      # behind; a private repository refuses that read to a job without it -- and
      # here the refusal would not fail loudly, it would land in the WARN branch
      # and leave the update pull request standing.
      checks: read
    steps:
      # `main`, and not the dispatch's commit: the version-bump commit this run
      # merged has moved main past it, and the tree the update applies to must
      # be the tree main holds right now.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run the update machinery on this tree
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMATON_UPDATE_TOKEN: ${{ secrets.ATOMATON_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          # The update script itself, run on this checkout -- not dispatched to
          # the deployed workflow. The machinery that exists on the default branch
          # right now is the release BEFORE this one, and a machinery cannot
          # bootstrap itself through its predecessor: the first application of a
          # release has to be made by the code that release carries. This is the
          # same script, the same arguments, and the same token the machinery's
          # own workflow would run them with; pinned to the tag this run
          # published, never `latest`, which a concurrent release could move.
          bun src/entrypoints/machinery/update_atomaton.ts --repo "$REPO" --tag "$TAG"
          echo "::notice::${TAG} is published and was taken onto this repository's .github/ by the update machinery. Its pull request carries the plan; a conflicted application is waiting there for a person."
