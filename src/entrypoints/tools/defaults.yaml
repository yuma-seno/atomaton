# The tool servers every run starts with, and the hooks that watch all of them.
#
# Not yours to edit: this file is replaced wholesale on upgrade, and removing a
# server takes a capability from every agent that names it. It is here to be READ —
# so that overriding one in .github/atomaton/config.yaml means seeing what you are
# overriding.
#
# Same schema as `tools.servers` there. A name you write with the same spelling
# overrides this entry field by field; a name that is not here is added.
# `description` is this project's own and never reaches the core.

watch:
  after_tool:
    - ./hooks/workspace_guard.ts
servers:
  # Every server here is `unprefixed`, so a tool is called by its own name -- `read`,
  # `bash`, `create_pr` -- rather than by `server__name`. Those are the names every
  # mature harness uses and the ones a model has seen most, and a name it has seen is
  # a call it makes correctly on the first try.
  #
  # It is a setting rather than the only behaviour because a second server could then
  # claim a name the first already has, and the core refuses two that do. Naming a
  # tool is therefore also what decides which server a call reaches, which is why the
  # pairs below that share an implementation -- `atomaton` with `atomaton_env`, the
  # four delegate entries -- are still separate entries: each names a different set of
  # tools, and no agent is given two servers that claim one.
  #
  # A `tool_allowlist` or `tool_denylist` is written with these same bare names. The
  # list sits inside one server's entry, so a pattern naming that server would be the
  # entry repeating a label atoma assembles afterwards.
  #
  # `files` and `files_readonly` replace `@modelcontextprotocol/server-filesystem`,
  # which has no line range and no content search: measured over two runs, 37 of 63
  # shell calls were `sed -n A,Bp` and `grep -rn`, rebuilding both by hand. See
  # `tools/mcp/files.ts` for what was evaluated before writing one.
  files:
    description: Reads, searches and changes files in the work tree.
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/files.ts"
    env:
      {}
    hooks:
      # Counts `grep`, `glob` and `list` towards the same search streak `shell_guard`
      # keeps, and refuses past the same limit. Without it, giving the agents a real
      # search tool would have opened an uncounted path around a rule that already
      # exists -- the same act, through a better door.
      before_tool: ./hooks/files_guard.ts
      after_tool: ./hooks/note_file_opened.ts
  files_readonly:
    description: "Reads and searches files and changes nothing, for agents that must not write."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/files.ts"
    env:
      {}
    hooks:
      # Named as operations rather than as a list of every tool that exists, which is
      # the failure this replaces: the old list held five names, so every read the
      # server had that nobody thought of on the day was refused by a server whose whole
      # purpose is reading -- 64 calls, all of them reads. Six tools now, and the three
      # that write are the ones left out.
      #
      # A pattern here that matches nothing is reported at startup, in the run's log,
      # so this list cannot quietly stop applying.
      #
      # Atomaton's own release checks it against the live server as well:
      # `self/atomaton/scripts/publish-release.sh` asks these servers what they offer and holds every
      # pattern here to it before publishing. That is Atomaton's release, not this
      # repository's -- `deploy` ships empty, so nothing here
      # runs it for you unless you wire it. Whichever release runs it, it runs after
      # a merge and never on a pull request: starting a pull request's declared
      # servers is not something a check that reads its configuration as data may do.
      tool_allowlist:
        - read
        - grep
        - glob
        - list
      before_tool: ./hooks/files_guard.ts
      after_tool: ./hooks/note_file_opened.ts
  shell:
    description: "Runs one foreground command. Guarded, and holds no credentials of its own."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/shell.ts"
    env:
      {}
    request_timeout_secs: 3600
    hooks:
      before_tool: ./hooks/shell_guard.ts
  github:
    description: "Issues, pull requests, comments, and every Git mutation."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/github.ts"
    env:
      GH_TOKEN: "${GH_TOKEN}"
    hooks:
      {}
  web:
    description: "Fetches a URL. Searching the web is a skill, not a tool."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/web.ts"
    env:
      {}
    hooks:
      {}
  search:
    description: "Ranked search over this repository's issues and code."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/search.ts"
    env:
      GH_TOKEN: "${GH_TOKEN}"
    request_timeout_secs: 300
    hooks:
      {}
    settings:
      reranker_model: onnx-community/bge-reranker-v2-m3-ONNX
  atomaton:
    description: "Atomaton's own operations: sub-issues, handoffs, stopping a run."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/atomaton.ts"
    env:
      GH_TOKEN: "${GH_TOKEN}"
    hooks:
      {}
  # The user-asset upload endpoint — what `gh --attach` posts to — is reached
  # only from here. `gh` refuses the Actions token client-side before any
  # request is built (`gho_`/`ghp_`/`github_pat_` are its allowlist; a `ghs_`
  # is not on it, measured on the cli/cli source at v2.101.0), and `curl` is
  # routed away from the shell, which holds no credential to send anyway. So
  # the POST lives where the token lives, and `probe` is the endpoint check
  # that could not run anywhere else — the check `engineering/secrets-in-a-check`
  # says belongs after a merge, in the tool that a merge puts into runs.
  #
  # Added as its own server rather than a tool on `github`: an agent that
  # reaches for an upload should have to name it, because `upload` stores a
  # permanent file on GitHub's CDN with no documented way to delete it.
  attachments:
    description: "Probes and uses GitHub's user-asset upload endpoint (the one `gh --attach` posts to). Its `probe` tool reports the status and body the endpoint returned; only mode `upload` stores anything, and a stored asset has no documented deletion."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/attachments.ts"
    env:
      GH_TOKEN: "${GH_TOKEN}"
    # Above the server's own 120-second abort, so a POST that never answers is
    # reported BY the server rather than cut off here. At the 60-second default the
    # `tools/call` is discarded while the server keeps working -- and in `upload`
    # mode it may still store the file, retiring exactly the one outcome this probe
    # must never produce without saying so. The same shape as `delegate`'s 660 over
    # its sub-run's 600-second limit.
    request_timeout_secs: 180
    hooks:
      {}
  atomaton_env:
    description: "Rebuilding the run's environment, and nothing else."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/atomaton.ts"
    env:
      GH_TOKEN: "${GH_TOKEN}"
    hooks:
      # The same program as `atomaton`, with two tools withheld -- so an engineer can
      # rebuild its environment and cannot close its own issue or dispatch an agent.
      # `launch_sub_agent` and `request_close_issue` are what the core's own
      # `duplicate_tool` check would otherwise see this server claim a second time.
      tool_allowlist:
        - reload_environment
  # The one server that starts another `atoma`. It holds the provider keys because
  # a tool server receives a credential only through its `env:` block, and it hands
  # them to the sub-run through `--credentials-file` rather than the environment --
  # see `mcp/delegate.ts` for why that distinction is the whole of the arrangement.
  #
  # `GH_TOKEN` is deliberately absent: the sub-run is given `files` and `shell` and
  # no `github`, so a token it cannot use is a token that can only leak.
  #
  # `ATOMA_PROVIDER` is deliberately absent too, and for the opposite reason: it is
  # not a credential, so it is inherited rather than stripped, and writing it here
  # would expand it against the credentials (where it is not) to an empty string and
  # overwrite the inherited value.
  delegate:
    description: "Runs one small piece of work in a sub-run and returns what it found."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/delegate.ts"
      - --agent-def
      - delegate.md
      # Layout-relative, NOT root-prefixed. `delegate.ts` resolves this with
      # `machineryPath()`, which is the one place that reads
      # `ATOMATON_MACHINERY_ROOT`; prefixing it here as well produced
      # `<root>/<root>/.github/...` and the server refused to start. The script
      # path above is the opposite case -- nothing resolves it but the shell, so
      # it carries the root itself.
      - --delegates-dir
      - ".github/atomaton-runtime/tools/delegates"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      ORCAROUTER_API_KEY: "${ORCAROUTER_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ATOMA_COPILOT_TOKEN: "${ATOMA_COPILOT_TOKEN}"
    # Above the sub-run's own ten-minute limit, so the sub-run stops itself and
    # reports why rather than being killed mid-inference with nothing to say.
    request_timeout_secs: 660
    hooks: {}
  # The same program, with a sub-run that cannot write. It exists so that an agent
  # holding `files_readonly` — the reviewer — cannot reach a writing server by
  # delegating to one: a sub-run's servers must be a subset of its caller's, and
  # that is a configuration fact rather than something a runtime check can see.
  #
  # `files_readonly` and no `shell`, because a shell is a way to write.
  delegate_readonly:
    description: "Runs one small piece of reading or searching in a sub-run and returns what it found, changing nothing."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/delegate.ts"
      - --agent-def
      - delegate_readonly.md
      # Layout-relative, for the same reason as `delegate` above.
      - --delegates-dir
      - ".github/atomaton-runtime/tools/delegates"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      ORCAROUTER_API_KEY: "${ORCAROUTER_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ATOMA_COPILOT_TOKEN: "${ATOMA_COPILOT_TOKEN}"
    request_timeout_secs: 660
    hooks: {}
  # The same two entries again, with the sub-run on the free router. Nothing differs
  # but `--agent-def`, and that is the point: which model runs a delegated task is a
  # property of the definition, so it is one more pair of entries here rather than a
  # model argument a caller could pass. See `delegates/delegate_free.md`.
  #
  # ## Why both halves, when the free one is cheaper
  #
  # The free tier is rate-limited rather than metered, and its limits are per
  # ACCOUNT rather than per task: what it will carry is not knowable from here, and
  # the only way to find out is to send something. These entries are that probe,
  # made cheap — a task a caller has already decided is small.
  #
  # ## What a caller does with the pair
  #
  # Reach for `delegate_free` first. The two are the same program, the same servers
  # and the same role prompt; only the price differs, so the free one is the right
  # default and the paid one is for a task that has failed on cost rather than on
  # content. A free sub-run that dies does so with a report — the caller reads what
  # it said, narrows the task or pays for it — which is different from the silence a
  # fallback chain would leave.
  delegate_free:
    description: "The same work as `delegate`, run on a free model. Prefer it: a task that fits the free tier costs nothing, and one that does not says so."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/delegate.ts"
      - --agent-def
      - delegate_free.md
      - --delegates-dir
      - ".github/atomaton-runtime/tools/delegates"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      ORCAROUTER_API_KEY: "${ORCAROUTER_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ATOMA_COPILOT_TOKEN: "${ATOMA_COPILOT_TOKEN}"
    request_timeout_secs: 660
    hooks: {}
  delegate_readonly_free:
    description: "The same reading as `delegate_readonly`, run on a free model. Prefer it for the same reason: only the price differs."
    unprefixed: true
    command: bun
    args:
      - run
      - "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/tools/mcp/delegate.ts"
      - --agent-def
      - delegate_readonly_free.md
      - --delegates-dir
      - ".github/atomaton-runtime/tools/delegates"
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      ORCAROUTER_API_KEY: "${ORCAROUTER_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ATOMA_COPILOT_TOKEN: "${ATOMA_COPILOT_TOKEN}"
    request_timeout_secs: 660
    hooks: {}